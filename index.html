<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>beedev_labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0c10;
  --surface:#13161d;
  --surface2:#181c24;
  --line:#242933;
  --text:#eceef1;
  --text-dim:#8a93a3;
  --honey:#e3a83b;
  --honey-dim:#b8862a;
  --danger:#e5626a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--ink);
  color:var(--text);
  font-family:'Inter',Arial,sans-serif;
  min-height:100%;
}

/* HERO */
.hero{
  padding:34px 20px 26px;
  border-bottom:1px solid var(--line);
  background:
    radial-gradient(120% 140% at 15% -10%, rgba(227,168,59,.10), transparent 55%),
    var(--ink);
}
.hero-inner{max-width:640px;margin:auto}
.wordmark{
  font-family:'Space Grotesk',sans-serif;
  font-size:30px;
  font-weight:700;
  letter-spacing:-.5px;
  line-height:1.1;
}
.wordmark em{
  font-style:normal;
  color:var(--honey);
}
.search-wrap{margin-top:22px}
.search{
  width:100%;
  background:transparent;
  border:0;
  border-bottom:1px solid var(--line);
  color:var(--text);
  font-size:14px;
  padding:9px 2px;
  outline:none;
  font-family:'Inter',sans-serif;
}
.search::placeholder{color:var(--text-dim)}
.search:focus{border-bottom-color:var(--honey)}

/* CONTENT */
.container{max-width:640px;margin:auto;padding:22px 20px 90px}
.section-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:13px;
}
.section-head h2{
  font-family:'Space Grotesk',sans-serif;
  font-size:15px;
  font-weight:600;
}
.count{color:var(--text-dim);font-size:11px}

.apps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  min-width:0;
  transition:border-color .15s ease;
}
.card:hover{border-color:var(--honey-dim)}
.icon{
  width:38px;height:38px;
  border-radius:8px;
  object-fit:cover;
  background:var(--surface2);
  display:block;
}
.name{
  font-family:'Space Grotesk',sans-serif;
  font-size:13.5px;
  font-weight:600;
  margin-top:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.desc{
  color:var(--text-dim);
  font-size:10.5px;
  line-height:14px;
  height:28px;
  overflow:hidden;
  margin-top:3px;
}
.open{
  display:block;
  text-align:center;
  text-decoration:none;
  background:var(--honey);
  color:#1a1300;
  padding:7px;
  border-radius:6px;
  margin-top:10px;
  font-size:11px;
  font-weight:600;
}
.open:active{transform:scale(.97)}

.empty{text-align:center;color:var(--text-dim);font-size:13px;padding:50px 10px;display:none}

footer{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--ink);
  border-top:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-bottom,0px)) 10px 10px;
  text-align:center;
  color:var(--text-dim);
  font-size:10px;
}
.adminButton{border:0;background:none;color:var(--honey);margin-left:8px;cursor:pointer;font-size:10px;font-family:inherit}

/* ADMIN */
.admin{display:none;position:fixed;inset:0;z-index:50;background:var(--ink);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 40px}
.adminBox{max-width:560px;margin:auto}
.adminHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.adminHeader h2{font-family:'Space Grotesk',sans-serif;font-size:19px}
.close{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 12px;font-family:inherit}
.form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.form h3{font-family:'Space Grotesk',sans-serif;font-size:14px;margin-bottom:10px;font-weight:600}
label{display:block;color:var(--text-dim);font-size:10.5px;margin:12px 0 5px}
input,textarea{
  width:100%;background:var(--ink);color:var(--text);
  border:1px solid var(--line);border-radius:8px;padding:10px;
  outline:none;font-size:12.5px;font-family:'Inter',sans-serif;
}
input:focus,textarea:focus{border-color:var(--honey)}
textarea{height:65px;resize:none}
.save{width:100%;border:0;background:var(--honey);color:#1a1300;border-radius:8px;padding:11px;margin-top:14px;font-weight:600;font-family:inherit}
.cancel{width:100%;border:1px solid var(--line);background:transparent;color:var(--text-dim);border-radius:8px;padding:9px;margin-top:8px;display:none;font-family:inherit}

.adminTitle{font-family:'Space Grotesk',sans-serif;font-size:13px;margin:22px 0 10px;font-weight:600}
.adminSite{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:7px}
.ad-slot{display:flex;justify-content:center;margin:18px 0}
.adminIcon{width:34px;height:34px;border-radius:7px;object-fit:cover}
.adminInfo{flex:1;min-width:0}
.adminInfo strong{display:block;font-size:12px;font-weight:600}
.adminInfo small{display:block;color:var(--text-dim);font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.actions{display:flex;gap:5px}
.actions button{border:0;border-radius:6px;padding:7px 9px;font-size:10px;font-family:inherit}
.edit{background:#26210f;color:var(--honey)}
.remove{background:#2a1518;color:var(--danger)}

.login{max-width:340px;margin:50px auto}
.login h2{font-family:'Space Grotesk',sans-serif;font-size:20px}
.login p{color:var(--text-dim);font-size:11px;margin:5px 0 20px}
.login button{width:100%;border:0;background:var(--honey);color:#1a1300;border-radius:8px;padding:11px;margin-top:10px;font-weight:600;font-family:inherit}
.error{color:var(--danger);font-size:10.5px;margin-top:9px;display:none}

@media(max-width:350px){.apps{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="wordmark">beedev<em>_labs</em></div>
    <div class="search-wrap">
      <input id="search" class="search" type="text" placeholder="Rechercher un projet…">
    </div>
  </div>
</div>

<main class="container">
  <div class="section-head">
    <h2>Projets</h2>
    <span id="count" class="count"></span>
  </div>
  <div id="apps" class="apps"></div>
  <div id="empty" class="empty">Aucun projet trouvé.</div>

  <div class="ad-slot">
    <script>
      atOptions = {
        'key' : '270ee20db58abc519213a294da7ae334',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script src="https://www.highrevenueformat.com/270ee20db58abc519213a294da7ae334/invoke.js"></script>
  </div>
</main>

<footer>
  © 2026 beedev_labs
  <button class="adminButton" onclick="openAdmin()">Admin</button>
</footer>

<div id="admin" class="admin">
  <div class="adminBox">

    <div id="loginScreen" class="login">
      <div class="adminHeader">
        <div><h2>Administration</h2><p>Accès réservé au propriétaire</p></div>
        <button class="close" onclick="closeAdmin()">✕</button>
      </div>
      <div class="form">
        <label>Identifiant</label>
        <input id="username" autocomplete="username">
        <label>Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password">
        <button onclick="login()">Se connecter</button>
        <div id="loginError" class="error">Identifiant ou mot de passe incorrect.</div>
      </div>
    </div>

    <div id="dashboard" style="display:none">
      <div class="adminHeader">
        <div><h2>Dashboard</h2><p style="color:var(--text-dim);font-size:10px;margin-top:3px">beedev_labs</p></div>
        <button class="close" onclick="logout()">Déconnexion</button>
      </div>

      <div class="form">
        <h3 id="formTitle">+ Ajouter un projet</h3>
        <label>Nom</label>
        <input id="siteName" placeholder="Ex : BeeFlix">
        <label>Description</label>
        <textarea id="siteDesc" placeholder="Description du projet"></textarea>
        <label>Lien</label>
        <input id="siteUrl" placeholder="https://exemple.com">
        <label>Logo / image</label>
        <input id="siteImg" placeholder="https://exemple.com/logo.png">
        <button class="save" onclick="saveSite()">Enregistrer</button>
        <button id="cancel" class="cancel" onclick="cancelEdit()">Annuler</button>
      </div>

      <div class="adminTitle">Projets enregistrés</div>
      <div id="adminSites"></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://cetbspgxsqbaousqrara.supabase.co";
const SUPABASE_KEY="sb_publishable_jVfbOWScVx_C4fXI1D_srA_CONVraPa";
const db=window.supabase?.createClient
  ? window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)
  : null;

let sites=[];
let editId=null;
let lastSearch="";

async function loadSites(){
  if(!db){
    console.error("Supabase n'est pas chargé.");
    renderSites(lastSearch);
    return;
  }
  try{
    const {data,error}=await db.from("beedev_labs_sites").select("*").order("created_at",{ascending:false});
    if(error){
      console.error("Erreur Supabase:",error);
      renderSites(lastSearch);
      return;
    }
    sites=data||[];
    renderSites(lastSearch);
    if(document.getElementById("dashboard").style.display==="block")renderAdmin();
  }catch(err){
    console.error("Erreur de connexion:",err);
    renderSites(lastSearch);
  }
}

if(db){
  db.channel("beedev_labs_sites_changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"beedev_labs_sites"},()=>loadSites())
    .subscribe();
}

function renderSites(search=""){
  lastSearch=search;
  const box=document.getElementById("apps");
  const empty=document.getElementById("empty");
  const count=document.getElementById("count");
  box.innerHTML="";
  const results=sites.filter(s=>s.name.toLowerCase().includes(search.toLowerCase()));
  count.textContent=results.length+" projet(s)";
  if(results.length===0){empty.style.display="block";return;}
  empty.style.display="none";
  results.forEach(site=>{
    box.innerHTML+=`
      <div class="card">
        <img class="icon" src="${safe(site.img)}" onerror="this.src='https://placehold.co/100x100/181c24/e3a83b?text=DEV'">
        <div class="name">${safe(site.name)}</div>
        <div class="desc">${safe(site.description)}</div>
        <a class="open" href="${safe(site.url)}" target="_blank" rel="noopener">Ouvrir</a>
      </div>
    `;
  });
}

const ADMIN_USER="admin";
let adminPassword=sessionStorage.getItem("beedev_admin_pass")||null;

function openAdmin(){
  document.getElementById("admin").style.display="block";
  if(sessionStorage.getItem("beedev_admin")==="1" && adminPassword){showDashboard();}else{showLogin();}
}
function closeAdmin(){document.getElementById("admin").style.display="none";}
async function login(){
  if(!db){
    document.getElementById("loginError").textContent="Connexion à la base de données indisponible.";
    document.getElementById("loginError").style.display="block";
    return;
  }
  const user=document.getElementById("username").value.trim().toLowerCase();
  const pass=document.getElementById("password").value;
  if(user!==ADMIN_USER){
    document.getElementById("loginError").textContent="Identifiant incorrect.";
    document.getElementById("loginError").style.display="block";
    return;
  }
  const {data,error}=await db.rpc("beedev_labs_verify_password",{p_password:pass});
  if(error){
    console.error("Erreur RPC:",error);
    document.getElementById("loginError").textContent="Connexion au serveur impossible ("+(error.message||"réseau")+").";
    document.getElementById("loginError").style.display="block";
    return;
  }
  if(!data){
    document.getElementById("loginError").textContent="Mot de passe incorrect.";
    document.getElementById("loginError").style.display="block";
    return;
  }
  adminPassword=pass;
  sessionStorage.setItem("beedev_admin","1");
  sessionStorage.setItem("beedev_admin_pass",pass);
  showDashboard();
}
function logout(){adminPassword=null;sessionStorage.removeItem("beedev_admin");sessionStorage.removeItem("beedev_admin_pass");showLogin();}
function showLogin(){document.getElementById("loginScreen").style.display="block";document.getElementById("dashboard").style.display="none";}
function showDashboard(){document.getElementById("loginScreen").style.display="none";document.getElementById("dashboard").style.display="block";renderAdmin();}

function renderAdmin(){
  const box=document.getElementById("adminSites");
  box.innerHTML="";
  if(sites.length===0){box.innerHTML=`<div style="color:var(--text-dim);font-size:11px">Aucun projet.</div>`;return;}
  sites.forEach(site=>{
    box.innerHTML+=`
      <div class="adminSite">
        <img class="adminIcon" src="${safe(site.img)}">
        <div class="adminInfo"><strong>${safe(site.name)}</strong><small>${safe(site.url)}</small></div>
        <div class="actions">
          <button class="edit" onclick="editSite(${site.id})">Modifier</button>
          <button class="remove" onclick="deleteSite(${site.id})">Suppr.</button>
        </div>
      </div>
    `;
  });
}

async function saveSite(){
  if(!db){alert("Connexion à la base de données indisponible.");return;}
  const name=document.getElementById("siteName").value.trim();
  const desc=document.getElementById("siteDesc").value.trim();
  const url=document.getElementById("siteUrl").value.trim();
  const img=document.getElementById("siteImg").value.trim();
  if(!name||!url){alert("Le nom et le lien sont obligatoires.");return;}
  let error;
  if(editId!==null){
    ({error}=await db.rpc("beedev_labs_update",{p_password:adminPassword,p_id:editId,p_name:name,p_description:desc,p_url:url,p_img:img}));
    editId=null;
    document.getElementById("formTitle").textContent="+ Ajouter un projet";
    document.getElementById("cancel").style.display="none";
  }else{
    ({error}=await db.rpc("beedev_labs_insert",{p_password:adminPassword,p_name:name,p_description:desc,p_url:url,p_img:img}));
  }
  if(error){alert("Erreur : "+error.message);return;}
  clearForm();
  await loadSites();
}

function editSite(id){
  const site=sites.find(x=>x.id===id);
  if(!site)return;
  editId=id;
  document.getElementById("siteName").value=site.name;
  document.getElementById("siteDesc").value=site.description;
  document.getElementById("siteUrl").value=site.url;
  document.getElementById("siteImg").value=site.img;
  document.getElementById("formTitle").textContent="Modifier le projet";
  document.getElementById("cancel").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEdit(){
  editId=null;
  clearForm();
  document.getElementById("formTitle").textContent="+ Ajouter un projet";
  document.getElementById("cancel").style.display="none";
}

async function deleteSite(id){
  if(!db){alert("Connexion à la base de données indisponible.");return;}
  const site=sites.find(x=>x.id===id);
  if(!site)return;
  if(confirm("Supprimer « "+site.name+" » ?")){
    const {error}=await db.rpc("beedev_labs_delete",{p_password:adminPassword,p_id:id});
    if(error){alert("Erreur : "+error.message);return;}
    await loadSites();
  }
}

function clearForm(){
  document.getElementById("siteName").value="";
  document.getElementById("siteDesc").value="";
  document.getElementById("siteUrl").value="";
  document.getElementById("siteImg").value="";
}

document.getElementById("search").addEventListener("input",function(){renderSites(this.value);});

function safe(value){
  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

loadSites();
</script>

</body>
</html>
